[build]
  command = "pnpm build"
  publish = "dist" 

[build.environment]
  NODE_ENV = "production" 

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "max-age=31536000, public"
