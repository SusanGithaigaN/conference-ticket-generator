<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Conference ticket generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
      @tailwind base;
      @tailwind components;
      @tailwind utilities;
      @layer utilities {
        /* Background images */
        .bg-img {
          background-image: url("./src/assets/images/background-desktop.png");
        }
        .line-top {
          background-image: url("./src/assets/images/pattern-squiggly-line-top.svg");
        }
        .line-bottom {
          background-image: url("./src/assets/images/pattern-squiggly-line-bottom.svg");
        }
        .patternTicket{
          background-image: url("./src/assets/images/pattern-ticket.svg");
        }
        /* colors */
        .gradientPink {
          background-image: linear-gradient(
            to right,
            hsl(7, 86%, 67%),
            hsl(0, 0%, 100%)
          );
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        .accentPink {
          color: hsl(7, 86%, 67%);
        }
        .darkOrange {
          background-color: hsl(7, 71%, 60%);
        }
        .bgNeutral {
          color: hsl(252, 6%, 83%);
        }
        .bgLight {
          background-color: hsl(245, 15%, 58%);
        }
        .bgDark {
          color: hsl(245, 19%, 35%);
        }
        .bgDarker {
          color: hsl(248, 70%, 10%);
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
